<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="website_container">
      <nav class="navigation transition-colors">
        <div class="nav_content container">
          <!-- Logo -->

          <div class="logo_wrapper">
            <i class="fa-solid fa-solar-panel"></i>
            <span class="logo_text">Georeno</span>
            <sup class="copyright">©</sup>
          </div>
          <div class="actions_container">
            <button
              id="mobileButton"
              class="mobile_button"
              type="button"
              aria-expanded="false"
            >
              <i class="fa-solid fa-bars icon-bars"></i>
              <i class="fa-solid fa-xmark icon-x"></i>
            </button>
          </div>
        </div>
      </nav>

      <!-- Fullscreen mobile menu -->
      <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
        <!-- close button on mobile menu -->
        <button
          class="mobile-menu__close"
          id="menuClose"
          type="button"
          aria-label="Close menu"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <!-- background watermark -->
        <div class="mobile-menu__ring"></div>
        <div class="mobile-menu_top">
          <span class="mobile-menu__label">NAVIGATION</span>
          <nav class="mobile-menu__links">
            <a href="" class="mobile-menu__link">Home</a>
            <a href="" class="mobile-menu__link">About</a>
            <a href="" class="mobile-menu__link">Technology</a>
            <a href="" class="mobile-menu__link">Specs</a>
            <a href="" class="mobile-menu__link">Reviews</a>
          </nav>
        </div>
        <div class="mobile-menu__bottom">
          <div class="mobile-menu__grid">
            <div class="mobile-menu__info">
              <span class="mobile-menu__infoLabel">Contact</span>
              <p class="mobile-menu__infoText">hello@goreno.tech</p>
            </div>
            <div class="mobile-menu__info">
              <span class="mobile-menu__infoLabel">OFFICE</span>
              <p class="mobile-menu__infoText">Zurich, CH</p>
            </div>
          </div>
          <button class="mobile-menu__cta" type="button">
            START CONFIGURATION
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- HERO SECTION -->
      <main class="main-section">
        <section class="hero-section">
          <!--  Background Image placeholder-->
          <div class="hero-section__background-image-wrapper">
            <div class="hero-section__background-image-gradient"></div>
          </div>

          <!-- MAIN CONTENT -->
          <div class="hero-section__main-content container">
            <div class="hero-section__main-content-heading-wrapper">
              <h1 class="hero-section__main-content-heading">
                Goreno &nbsp;

                <sup class="hero-section__copyright"> ® </sup>
              </h1>
            </div>

            <!-- Bottom Section -->
            <div class="hero-section__bottom-content-wrapper">
              <div class="hero-content__bottom-content">
                <div class="custom-l-shape-1"></div>
                <div class="custom-l-shape-2"></div>
                <div class="hero-section__bottom-content-icons-wrapper">
                  <i class="fa-solid fa-sun sun-icon"></i>
                  <i class="fa-solid fa-leaf leaf-icon"></i>
                </div>
                <span class="hero-section__bottom-content-text">
                  Solar energy
                </span>
              </div>
              <!-- right description -->
              <div class="hero-section__right-description-wrapper">
                <p class="hero-section__right-description-text">
                  Generate your own clean energy from the sun for free with
                  solar. Add Powerwall to store your energy for use anytime.
                </p>
              </div>
            </div>
          </div>
          <!-- Background centerline - Hidden on small mobile to reduce clutter -->
          <!-- <div class="background-centerline"></div> -->
        </section>
      </main>
    </div>

    <script src="/script.js" defer></script>
  </body>
</html>
